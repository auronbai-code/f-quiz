<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FDE刷题">
<meta name="theme-color" content="#4f46e5">
<title>FDE 200题 · 刷题闪卡</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#1f2330;--mut:#6b7280;--line:#e5e7eb;--pri:#4f46e5;--pri2:#eef2ff;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--warn:#d97706;--warnbg:#fef3c7;--memo:#7c3aed;--memobg:#f5f3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--fg:#e5e7eb;--mut:#9ca3af;--line:#2d3240;--pri:#818cf8;--pri2:#252a45;--ok:#4ade80;--okbg:#14321f;--bad:#f87171;--badbg:#3b1717;--warn:#fbbf24;--warnbg:#3a2c0b;--memo:#c4b5fd;--memobg:#2a2140}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:17px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.big{font-size:22px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 12px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;text-align:center}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;text-align:left}
.mode b{display:block;font-size:16px}.mode span{font-size:12.5px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.top .t{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;font-size:18px;color:var(--fg);cursor:pointer}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri);margin:0 4px 4px 0}
.chip.r{background:var(--badbg);color:var(--bad)}.chip.w{background:var(--warnbg);color:var(--warn)}.chip.g{background:var(--okbg);color:var(--ok)}
.stem{font-size:18px;font-weight:600;margin:8px 0 14px;line-height:1.55}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:16px;color:var(--fg);cursor:pointer}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--pri)}.opt.sel .L{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .L{background:var(--bad);color:#fff}
.opt.miss{border-color:var(--warn);border-style:dashed}
.opt .tag{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.res{border-radius:12px;padding:10px 12px;font-weight:700;margin:12px 0}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.ex{border-left:4px solid var(--line);padding:8px 12px;margin:10px 0;border-radius:0 10px 10px 0;background:var(--card)}
.ex h4{margin:0 0 4px;font-size:13px}
.ex.o{border-color:var(--pri)}.ex.o h4{color:var(--pri)}
.ex.m{border-color:var(--memo);background:var(--memobg)}.ex.m h4{color:var(--memo)}
.ex.t{border-color:var(--warn);background:var(--warnbg)}.ex.t h4{color:var(--warn)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:9}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.flip{min-height:120px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--pri);border-radius:14px;color:var(--pri);font-weight:600;margin:12px 0;cursor:pointer}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px;font-size:12px}
.plan li{margin:4px 0}.plan .today{font-weight:700;color:var(--pri)}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:99}
a{color:var(--pri);font-weight:600}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:640px;margin:0 auto;padding:10px 14px calc(30px + env(safe-area-inset-bottom))}
.cs h3{font-size:15px;margin:16px 0 6px}.cs p{margin:6px 0;white-space:pre-line}
.cs .box{border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-line}
.lk{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card);text-decoration:none}
.lk small{display:block;font-weight:400;color:var(--mut);margin-top:2px}
.btn.prin{background:var(--memobg);color:var(--memo);border:1px solid var(--memo)}
ul.tips{padding-left:18px;margin:6px 0}ul.tips li{margin:5px 0}
</style>
</head>

<label class="mut" style="display:block;margin-bottom:12px"><input id="rm" type="checkbox" checked> 在这台设备上记住（下次免输）</label>
<button id="go" class="btn">解锁</button><p id="msg" class="mut" style="margin-top:10px"></p></div></div>

const KK='fde200_k';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openWith(key){
  const js=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)));
  const s=document.createElement('script');s.textContent=js;document.body.appendChild(s);
}
async function unlock(){
  const pw=document.getElementById('pw').value,msg=document.getElementById('msg'),btn=document.getElementById('go');
  if(!pw)return;btn.disabled=true;msg.textContent='解锁中…';
  const remember=document.getElementById('rm').checked;let key;
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  }catch(e){msg.textContent='密码不对，请重试';btn.disabled=false;return}
  if(remember){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem(KK,btoa(String.fromCharCode(...raw))+'|'+P.s)}
  await openWith(key);
}
(async()=>{
  if(!window.crypto||!crypto.subtle){document.getElementById('msg').textContent='请用 https 链接在系统浏览器中打开';return}
  const saved=localStorage.getItem(KK);
  if(saved){const [k,s]=saved.split('|');
    if(s===P.s){try{const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);await openWith(key);return}catch(e){}}
    localStorage.removeItem(KK)}
  document.getElementById('gate').style.display='block';
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  document.getElementById('go').onclick=unlock;
})();
</script>
